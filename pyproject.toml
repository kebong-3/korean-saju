[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ksaju"
version = "1.0.0"
description = "외부 의존성 없는 한국 사주명리 엔진 — 천문 계산 만세력, 십성·격국·용신·신살·대운·궁합, CLI·MCP 서버"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["saju", "사주", "만세력", "bazi", "four pillars", "korean lunar calendar", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Korean",
]

[project.scripts]
ksaju = "ksaju.cli:main"
ksaju-mcp = "ksaju.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
